name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-apk:
    name: Build EZERGG PC APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Build web assets
        working-directory: apps/web
        env:
        run: |
          if [ -z "$VITE_API_URL" ]; then echo "Configure a variável GitHub VITE_API_URL com a URL HTTPS da API."; exit 1; fi
          npm run build

      - name: Generate Android platform project
        working-directory: apps/web
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build debug APK
        working-directory: apps/web/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk EZERGG-PC-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EZERGG-PC-Android-APK
          path: EZERGG-PC-debug.apk
          if-no-files-found: error
          retention-days: 14
