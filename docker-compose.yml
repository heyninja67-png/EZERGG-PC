services:
  nevoz-api:
    build: ./server
    container_name: nevoz-setup-api
    restart: unless-stopped
    environment:
      PORT: "3001"
      DB_PATH: "/data/nevoz.sqlite"
      API_TOKEN: "${API_TOKEN:?Defina API_TOKEN no arquivo .env}"
      CORS_ORIGIN: "${CORS_ORIGIN:-}"
    ports:
      - "3001:3001"
    volumes:
      - nevoz_data:/data

volumes:
  nevoz_data:
    name: nevoz_setup_persistent_data
